name: Feature request
description: Propón una mejora para ShelfWise
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué problema resuelve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
    id: accept
    attributes:
      label: Criterios de aceptación
      placeholder: "- Dado ... cuando ... entonces ..."
